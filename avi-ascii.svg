<style>

.ascii-row {
    opacity: 0;
    animation:
        print-row 0.6s ease-out forwards;
}

@keyframes print-row {

    from {
        opacity: 0;
        transform: translateX(-12px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }

}

</style>

